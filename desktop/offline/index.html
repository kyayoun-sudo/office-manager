<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office Manager</title>
<style>
  :root { --brand:#142D4E; --ink:#1d2433; --muted:#5b6475; --bg:#f6f7f9; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e8ebf1; --muted:#a3abba; --bg:#11151c; } }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, "Segoe UI", sans-serif;
         display:flex; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
  main { max-width:440px; text-align:center; }
  .logo { width:64px; height:64px; border-radius:16px; background:var(--brand); margin:0 auto 20px;
          display:flex; align-items:center; justify-content:center; }
  .logo span { width:30px; height:30px; border-radius:50%; border:6px solid #fff; box-sizing:border-box; }
  p { color:var(--muted); }
  button { background:var(--brand); color:#fff; border:0; border-radius:10px; padding:10px 22px; font:inherit; cursor:pointer; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div class="logo"><span></span></div>
  <h1 id="title">Office Manager</h1>
  <p id="state">Connexion au serveur du cabinet…</p>
  <button id="retry" type="button" hidden>Réessayer</button>
</main>
<script>
  // The desktop app opens the firm's server. Its address is written here when the installer is built
  // (.github/workflows/desktop-release.yml, input « server_url »). Nothing of the firm's data lives on this computer.
  var SERVER = 'https://office.eynowa.com';
  var state = document.getElementById('state'), retry = document.getElementById('retry');
  function go() {
    state.textContent = 'Connexion au serveur du cabinet…'; retry.hidden = true;
    var ctl = new AbortController(), t = setTimeout(function () { ctl.abort(); }, 12000);
    // no-cors: this local page only needs to know the server is reachable (an opaque answer), never to read it.
    fetch(SERVER + '/api/health', { cache: 'no-store', mode: 'no-cors', signal: ctl.signal })
      .then(function () { clearTimeout(t); location.replace(SERVER + '/accueil.html'); })
      .catch(function () {
        clearTimeout(t);
        state.textContent = 'Le serveur du cabinet ne répond pas. Vérifiez votre connexion Internet, puis réessayez.';
        retry.hidden = false;
      });
  }
  retry.addEventListener('click', go);
  go();
</script>
</body>
</html>
