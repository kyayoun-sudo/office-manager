name: Firm Manager Mobile — contrôles

on:
  push:
    branches: [feature/mobile-pwa]
  pull_request:
    branches: [feature/white-label-desktop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Check syntax
        run: npm run check
      - name: Test mobile PWA
        run: node --test tests/mobile-shell.test.js tests/mobile-pwa.test.js tests/mobile-chat.test.js
      - name: Full regression
        run: npm test
      - name: SQL/schema tests
        run: npm run test:sql
